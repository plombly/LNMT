# Managed by LAIka NGINx Management Terminal - web dashboard, LAN and VPN only.
# Port 8443 is also limited to these networks by nftables.
server {
    listen 8443 ssl;
    server_name _;

    # Someone typing http:// gets sent to https:// instead of nginx's
    # "plain HTTP request was sent to HTTPS port" (400).
    error_page 497 =301 https://$host:$server_port$request_uri;
    ssl_certificate     /etc/nginx/lnmt-admin/admin.pem;
    ssl_certificate_key /etc/nginx/lnmt-admin/admin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # One "allow" per network in LNMT_TRUSTED_NETS (/etc/lnmt/lnmt.env):
    # @TRUSTED_NETS@
    allow 127.0.0.1;
    deny all;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 420s;
    }
}
