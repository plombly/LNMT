# Managed by LAIka NGINx Management Terminal
# Default TLS sink: unmatched hostnames must never reach a managed proxy.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_certificate     /etc/nginx/lnmt-sink/sink.pem;
    ssl_certificate_key /etc/nginx/lnmt-sink/sink.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}
